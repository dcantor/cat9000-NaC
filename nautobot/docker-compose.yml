# Nautobot on the NMS jumphost (10.0.0.10) — Nautobot + Celery worker/beat, PostgreSQL, Redis.
# Deployed by ../lab.sh nautobot install  →  http://10.0.0.10:8080
name: nautobot

x-nautobot: &nautobot
  image: cat9000v/nautobot:${NAUTOBOT_IMAGE_TAG:-3.2-py3.12}
  build:
    context: .
    args:
      NAUTOBOT_IMAGE_TAG: ${NAUTOBOT_IMAGE_TAG:-3.2-py3.12}
  env_file: .env
  restart: unless-stopped
  volumes:
    - nautobot_media:/opt/nautobot/media
    - nautobot_git:/opt/nautobot/git
    - ./nautobot_config.py:/opt/nautobot/nautobot_config.py:ro   # editable without a rebuild
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # one-shot: named volumes are created root-owned, the image runs as uid 999 (nautobot)
  volume_init:
    image: cat9000v/nautobot:${NAUTOBOT_IMAGE_TAG:-3.2-py3.12}
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 999:999 /opt/nautobot/media /opt/nautobot/git"]
    volumes:
      - nautobot_media:/opt/nautobot/media
      - nautobot_git:/opt/nautobot/git
    restart: "no"

  nautobot:
    <<: *nautobot
    depends_on:
      volume_init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health/"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s      # first start runs migrations and creates the superuser

  celery_worker:
    <<: *nautobot
    command: nautobot-server celery worker -l INFO --events
    depends_on:
      nautobot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "nautobot-server celery inspect ping --destination celery@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  celery_beat:
    <<: *nautobot
    command: nautobot-server celery beat -l INFO
    depends_on:
      nautobot:
        condition: service_healthy
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NAUTOBOT_DB_USER}
      POSTGRES_PASSWORD: ${NAUTOBOT_DB_PASSWORD}
      POSTGRES_DB: ${NAUTOBOT_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${NAUTOBOT_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$NAUTOBOT_REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      NAUTOBOT_REDIS_PASSWORD: ${NAUTOBOT_REDIS_PASSWORD}

  # Git server for Golden Config repositories (config backups, intended configs, templates)
  gitea:
    image: gitea/gitea:1.24
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://${NMS_IP:-10.0.0.10}:3000/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__database__DB_TYPE: sqlite3
    ports:
      - "3000:3000"
    volumes:
      - gitea_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  gitea_data:
  postgres_data:
  redis_data:
  nautobot_media:
  nautobot_git:

---
# Role-based configuration shared by both switches (medium precedence).
# Everything device-specific — VLANs, switchports, SVIs, loopbacks, STP priorities
# and the full BGP configuration (nautobot-bgp-models) — is GENERATED from Nautobot
# into devices.nac.yaml. Group-wide services and hardening live in global.nac.yaml.
iosxe:
  device_groups:
    - name: CORE_SWITCHES
      devices: [sw1, sw2]

---
# Role-based configuration shared by both switches (medium precedence).
iosxe:
  device_groups:
    - name: CORE_SWITCHES
      devices: [sw1, sw2]
      # VLAN database, switchports, SVIs, loopbacks, STP priorities and the BGP
      # networks are per device and GENERATED from Nautobot (devices.nac.yaml).
      # Only the iBGP peering skeleton lives here; bgp_asn / peer_transit_ip come
      # from the device variables (Nautobot config context and transit SVI IPs).
      configuration:
        routing:
          # iBGP (one AS) over the directly connected transit SVIs; each switch
          # originates its loopback and the VLANs it is the gateway for
          # (networks are listed per device in devices.nac.yaml)
          bgp:
            as_number: "${bgp_asn}"
            router_id: "${router_id}"
            log_neighbor_changes: true
            neighbors:
              - ip: "${peer_transit_ip}"
                remote_as: "${bgp_asn}"
                description: iBGP to peer core switch
            address_family:
              ipv4_unicast:
                neighbors:
                  - ip: "${peer_transit_ip}"
                    activate: true

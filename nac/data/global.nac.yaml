---
# Organisation-wide baseline: applied to every device unless overridden by a
# device group or a device (lowest precedence).
iosxe:
  templates:
    - name: errdisable_recovery
      type: cli
      content: |
        errdisable recovery cause bpduguard
        errdisable recovery interval 300
  global:
    templates: [errdisable_recovery]
    # Services (domain, NTP, syslog, SNMP, banner), the OOB VRF/default route and the
    # management ACL are GENERATED per device from the Nautobot config context
    # "lab-services" (nautobot/seed.py). This file keeps policy: hardening, STP defaults,
    # logging buffer, VTP mode, VTY lines (which reference the rendered ACL).
    configuration:
      system:
        ip_domain_lookup: false
        ip_routing: true
        # SSH hardening
        ssh:
          version: 2
          time_out: 60
          authentication_retries: 3
        # audit every login attempt to the buffer / NMS syslog
        login_on_success_log: true
        login_on_failure_log: true
      service:
        password_encryption: true
        tcp_keepalives_in: true
        tcp_keepalives_out: true
        timestamps:
          log_datetime: true
          log_datetime_msec: true
          log_datetime_localtime: true
          log_datetime_show_timezone: true
      # AAA: local authentication + exec authorization on every device (was only on sw2)
      aaa:
        new_model: true
        authentication:
          logins:
            - name: default
              methods: [local]
        authorization:
          execs:
            - name: default
              methods: [local]
      line:
        # IOS reports "line vty 0 15" back as two blocks (0-4 and 5-15); model it the same
        # way so Terraform's refresh matches. Both blocks are identical.
        vtys:
          - number_from: 0
            number_to: 4
            login_authentication: default
            transport_input: [ssh]
            exec_timeout_minutes: 10
            exec_timeout_seconds: 0
            logging_synchronous: true
            access_classes:
              - access_list: MGMT-ACCESS
                direction: in
                vrf_also: true          # VTY sessions arrive via Mgmt-vrf
          - number_from: 5
            number_to: 15
            login_authentication: default
            transport_input: [ssh]
            exec_timeout_minutes: 10
            exec_timeout_seconds: 0
            logging_synchronous: true
            access_classes:
              - access_list: MGMT-ACCESS
                direction: in
                vrf_also: true
      cdp:
        run: true
      # VTP transparent: VLANs live in running-config (not vlan.dat), so config backups and
      # Golden Config compliance can see the VLAN database
      vtp:
        mode: transparent
      lldp:
        run: true
      spanning_tree:
        mode: rapid-pvst
        extend_system_id: true
        # every access port is an edge port with BPDU guard unless configured otherwise
        portfast_default: true
        portfast_bpduguard_default: true
        # per-device root priorities live in devices.nac.yaml (sw1 root, sw2 backup)
      # errdisable recovery is delivered by the "errdisable_recovery" CLI template
      # (see templates below): the iosxe_errdisable resource breaks RESTCONF reads
      # of /native/errdisable on Cat9kv 17.18 ("no registration found for callpoint
      # ec_genet_deprecated" on detect/cause/all) after its first write.
      logging:
        buffered_size: 64000
        buffered_severity: informational

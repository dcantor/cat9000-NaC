# Lab settings — sourced by lab.sh
LAB_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
LIBVIRT_URI="qemu:///system"

# Cat9000v base image (never modified; nodes boot from qcow2 overlays)
CAT9KV_IMAGE="$LAB_DIR/cat9kv-universalk9_serial.17.18.02.qcow2"
CAT9KV_VCPU=4
CAT9KV_RAM_MIB=18432        # Cisco recommends 18 GB for Cat9000v
CAT9KV_DATA_PORTS=8         # Gi1/0/1..8 (NIC 1 = Gi0/0 mgmt)

# NMS / jumphost
NMS_IMAGE="$LAB_DIR/images/noble-server-cloudimg-amd64.img"
NMS_VCPU=2
NMS_RAM_MIB=4096
NMS_DISK_GB=20

# CirrOS end hosts (tiny Linux VMs hanging off switch access ports)
CIRROS_IMAGE="$LAB_DIR/images/cirros-0.6.3-x86_64-disk.img"
CIRROS_RAM_MIB=256
# host -> "switch:port vlan ip/prefix gateway"   (port = data port number, Gi1/0/<port>)
declare -A HOST_ATTACH=(
  [host1]="sw1:2 10 10.10.0.100/24 10.10.0.1"
  [host2]="sw2:4 20 10.20.0.100/24 10.20.0.1"
)

# OOB management network (libvirt bridge, host is 10.0.0.1)
OOB_NET="oob-mgmt"
OOB_SUBNET="10.0.0.0/24"
declare -A MGMT_IP=( [nms]=10.0.0.10 [sw1]=10.0.0.11 [sw2]=10.0.0.12 [host1]=10.0.0.21 [host2]=10.0.0.22 )

# Serial console TCP ports (raw, on 127.0.0.1)
declare -A CONSOLE_PORT=( [sw1]=5001 [sw2]=5002 [nms]=5003 [host1]=5004 [host2]=5005 )

# Node index → used to derive MACs and UDP link ports (every node with data ports needs one)
declare -A NODE_IDX=( [sw1]=1 [sw2]=2 [host1]=3 [host2]=4 )

# Point-to-point links between data ports (UDP tunnels — carry BPDUs/LACP/LLDP
# unmodified, unlike a Linux bridge). Format: "node:port node:port".
# Host links are derived from HOST_ATTACH (host port is always 1).
LINKS=(
  "sw1:1 sw2:1"
)
for _h in "${!HOST_ATTACH[@]}"; do read -r _sp _ <<<"${HOST_ATTACH[$_h]}"; LINKS+=("$_sp $_h:1"); done
unset _h _sp

SWITCHES=(sw1 sw2)
HOSTS=(host1 host2)
ALL_NODES=(sw1 sw2 nms host1 host2)
